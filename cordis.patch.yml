# ============================================================================
# dsh-reloader —— DSH bundle patch（插件自带挂载声明）
# ============================================================================
# 只要 profile 的 `dsh.profile.bundles` 列出本包名，这条 insert 就会被合进配置树。
# entry id 同时也是插件状态目录名（$DSH_HOME/dsh-reloader）。
# ============================================================================

- insert:
    - id: dsh-reloader
      name: dsh-reloader
      config:
        enabled: true
